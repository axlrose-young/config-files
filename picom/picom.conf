#################################
# Shadows
#################################

shadow = true;
shadow-radius = 18;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.20;

#################################
# Fading
#################################

fading = true;
fade-in-step = 0.25;
fade-out-step = 0.25;
fade-delta = 20;

#################################
# Opacity
#################################

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

#################################
# Corners
#################################

corner-radius = 8;
rounded-corners-exclude = [
    "class_g = 'dwm'"
];

#################################
# Backend
#################################

backend = "glx";
vsync = true;

#################################
# Blur (disabled)
#################################

blur:
{
    method = "none";
};

#################################
# Misc
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

#################################
# Animations
#################################

no-fading-openclose = false;
