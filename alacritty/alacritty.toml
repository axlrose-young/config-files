[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.94

[font]
size = 11

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 100000

[selection]
save_to_clipboard = true

[colors.primary]
background = "#2A2F2E"
foreground = "#E7EEF0"

[colors.cursor]
text = "#2A2F2E"
cursor = "#E7EEF0"

[colors.selection]
text = "#2A2F2E"
background = "#AFC3CA"

[colors.normal]
black   = "#2A2F2E"
red     = "#C86D52"
green   = "#768C65"
yellow  = "#D3A66B"
blue    = "#8EA5AE"
magenta = "#A98B9F"
cyan    = "#7AA5A8"
white   = "#D7E1E3"

[colors.bright]
black   = "#5A6466"
red     = "#D98468"
green   = "#8EA37A"
yellow  = "#E0B985"
blue    = "#AFC3CA"
magenta = "#BDA7B8"
cyan    = "#98BCC0"
white   = "#FFFFFF"
